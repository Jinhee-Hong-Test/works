const $=s=>document.querySelector(s),KEY='moa-roadmap-v1',labels={todo:'TO DO',doing:'IN PROGRESS',review:'IN REVIEW',skipped:'SKIPPED',done:'DONE'},colors=['#FF5B3B', '#FCD842', '#78EA1F', '#00D8AE', '#0C75E8', '#BA15FF', '#3F3F3F'];

function taskLinks(t){return '<div class="task-links">'+[['wiki','위키 열기'],['jira','지라 열기']].filter(([key])=>t[key]&&validLink(t[key])).map(([key,label])=>`<a href="${esc(t[key])}" target="_blank" rel="noopener noreferrer">${label}</a>`).join('')+'</div>'}

try{const raw=localStorage.getItem(KEY);if(raw!==null){const stored=JSON.parse(raw);const data=Array.isArray(stored)?stored:stored.tasks;if(!Array.isArray(stored)){if(!Array.isArray(stored.projects)||!stored.projects.every(p=>typeof p==='string'&&p.trim()&&p.length<=60))throw Error();registeredProjects=stored.projects;projectColors=readProjectColors(stored.projectColors);projectDeadlines=readProjectDeadlines(stored.projectDeadlines);meetings=readMeetings(stored.meetings);workHours=readWorkHours(stored.workHours);dayNotes=readDayNotes(stored.dayNotes)}if(!Array.isArray(data)||!data.every(valid)||new Set(data.map(t=>t.id)).size!==data.length)throw Error();tasks=data}}catch{toast('저장 데이터를 읽지 못했습니다. 백업 파일을 불러와 주세요.')}

let projectCompletions=Object.create(null),completionInitialized=false;
try{const raw=JSON.parse(localStorage.getItem(completionKey)||'{}');if(raw&&typeof raw==='object'&&!Array.isArray(raw))for(const [p,v] of Object.entries(raw)){if(v&&typeof v.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v.date))projectCompletions[p]={date:v.date,estimated:!!v.estimated}}}catch{}
function syncProjectCompletions(){let changed=false;const names=projects();for(const p of names){if(isProjectComplete(p)){if(!Object.hasOwn(projectCompletions,p)){projectCompletions[p]={date:iso(new Date()),estimated:!completionInitialized};changed=true}}else if(Object.hasOwn(projectCompletions,p)){delete projectCompletions[p];changed=true}}for(const p of Object.keys(projectCompletions)){if(!names.includes(p)){delete projectCompletions[p];changed=true}}completionInitialized=true;if(changed)try{persistProjectCompletions()}catch{toast('완료일 저장에 실패했습니다. 백업을 이용해 주세요.')}}
function projectCompletionLabel(p){const entry=projectCompletions[p];if(!entry)return '';return `<span class="project-completion-date">${entry.estimated?'완료 확인':'완료'} ${entry.date.replaceAll('-','.')}</span>`}

function projectFinalDue(project){if(projectDeadlines[project])return projectDeadlines[project].replaceAll('-','.');const dates=tasks.filter(t=>t.project===project&&t.end).map(t=>t.end).sort();return dates.length?dates[dates.length-1].replaceAll('-','.'):'미정'}
function projects(){return [...new Set([...registeredProjects,...tasks.map(t=>t.project)])].sort((a,b)=>a.localeCompare(b,'ko'))}function readProjectDeadlines(value){const result=Object.create(null);if(value===undefined)return result;if(!value||typeof value!=='object'||Array.isArray(value))throw Error();for(const [name,date] of Object.entries(value)){if(typeof date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(date)||isNaN(parse(date))||iso(parse(date))!==date)throw Error();result[name]=date}return result}

function color(p){if(Object.hasOwn(projectColors,p))return projectColors[p];const hash=Array.from(p).reduce((n,c)=>(n*31+c.codePointAt(0))>>>0,0);return colors[hash%colors.length]}function roadmapProjects(){const due=new Map();for(const t of tasks){if(t.end&&(!due.has(t.project)||t.end<due.get(t.project)))due.set(t.project,t.end)}return projects().sort((a,b)=>(due.get(a)||'9999-99-99').localeCompare(due.get(b)||'9999-99-99')||a.localeCompare(b,'ko'))}

 if(!end)return '—Days';

function timeMinutes(value){return Number(value.slice(0,2))*60+Number(value.slice(3,5));}
function readWorkHours(value){
 if(value===undefined||value&&value.presetVersion!==2&&value.start==='09:00'&&value.end==='18:00'&&value.breakStart==='12:00'&&value.breakEnd==='13:00')return {start:'10:00',end:'19:00',breakStart:'11:30',breakEnd:'13:30',presetVersion:2};
 const validTime=v=>typeof v==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(v);
 if(!value||!validTime(value.start)||!validTime(value.end)||value.end<=value.start||typeof value.breakStart!=='string'||typeof value.breakEnd!=='string')throw Error('Invalid work hours');
 if(value.breakStart||value.breakEnd){if(!validTime(value.breakStart)||!validTime(value.breakEnd)||value.breakEnd<=value.breakStart||value.breakStart<value.start||value.breakEnd>value.end)throw Error('Invalid break');}
 return {start:value.start,end:value.end,breakStart:value.breakStart,breakEnd:value.breakEnd,presetVersion:2};
}
function calculateWorkCapacity(hours,list){
 const start=timeMinutes(hours.start),end=timeMinutes(hours.end),gross=end-start;
 const pause=hours.breakStart?[timeMinutes(hours.breakStart),timeMinutes(hours.breakEnd)]:null;
 const breakMinutes=pause?pause[1]-pause[0]:0;
 const intervals=[];let unknown=0;
 for(const m of list){
  if(!m.end){if(timeMinutes(m.start)<end)unknown++;continue;}
  const a=Math.max(start,timeMinutes(m.start)),b=Math.min(end,timeMinutes(m.end));
  if(a<b)intervals.push([a,b]);
 }
 intervals.sort((a,b)=>a[0]-b[0]);const merged=[];
 for(const [a,b] of intervals){const last=merged.at(-1);if(last&&a<=last[1])last[1]=Math.max(last[1],b);else merged.push([a,b]);}
 let meetingMinutes=0;
 for(const [a,b] of merged)meetingMinutes+=b-a-(pause?Math.max(0,Math.min(b,pause[1])-Math.max(a,pause[0])):0);
 return {gross,breakMinutes,meetingMinutes,available:Math.max(0,gross-breakMinutes-meetingMinutes),unknown};
}
function durationText(minutes){const h=Math.floor(minutes/60),m=minutes%60;return h?(h+'시간'+(m?' '+m+'분':'')):m+'분';}

function meetingTimeRange(hour,minute,duration){

 if(!value||typeof value!=='object'||Array.isArray(value))throw Error('Invalid day notes');
 for(const [date,note] of Object.entries(value)){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||isNaN(parse(date))||iso(parse(date))!==date||typeof note!=='string'||note.length>10000)throw Error('Invalid day note');
  result[date]=note;
 }
 return result;
}
// Save on input so switching menus or closing the page does not lose a pending debounce.
$('#view').addEventListener('input',event=>{
 const field=event.target;if(field.id!=='day-note')return;
 const date=field.dataset.noteDate;
 if(field.value)dayNotes[date]=field.value;else delete dayNotes[date];
 const saved=save(),status=$('#day-note-status');
 if(status)status.textContent=saved?(window.PWorksCloudSave?'기기에 저장됨 · 동기화 대기':'저장됨'):'저장 실패 · 내용을 복사해 보관해주세요';
});

window.PWorksBridge = {
 snapshot:()=>JSON.parse(JSON.stringify({version:3,dayNotes,workHours,meetings,tasks,projects:registeredProjects,projectDeadlines,projectColors,vacations,projectCompletions})),
 apply(data){
  if(!data||data.version!==3||!Array.isArray(data.tasks)||!data.tasks.every(valid)||new Set(data.tasks.map(t=>t.id)).size!==data.tasks.length||!Array.isArray(data.projects)||!data.projects.every(p=>typeof p==='string'&&p.trim()&&p.length<=60)||!Array.isArray(data.vacations)||!data.vacations.every(validVacation))throw Error('Invalid cloud data');
  const nextDayNotes=readDayNotes(data.dayNotes),nextWorkHours=readWorkHours(data.workHours),nextMeetings=readMeetings(data.meetings),nextColors=readProjectColors(data.projectColors),nextDeadlines=readProjectDeadlines(data.projectDeadlines),nextCompletions=Object.create(null);
  if(!data.projectCompletions||typeof data.projectCompletions!=='object'||Array.isArray(data.projectCompletions))throw Error('Invalid completions');
  for(const [p,v] of Object.entries(data.projectCompletions)){if(!v||typeof v.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v.date))throw Error('Invalid completion date');nextCompletions[p]={date:v.date,estimated:!!v.estimated};}
  dayNotes=nextDayNotes;workHours=nextWorkHours;meetings=nextMeetings;tasks=data.tasks;registeredProjects=data.projects;vacations=data.vacations;projectColors=nextColors;projectDeadlines=nextDeadlines;projectCompletions=nextCompletions;completionInitialized=true;sample=false;
  if(activeProject&&!projects().includes(activeProject)){activeProject=null;selectedDeadlineTask=null;}
  filters();render();
 },
 editing:()=>!!document.querySelector('dialog[open]')||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName),
 notify:toast
};

filters();render();
</script>
